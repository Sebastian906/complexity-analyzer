version: '3.8'

services:
  # ============================================================================
  # API Backend - FastAPI
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: complexity-analyzer-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - redis
    networks:
      - complexity-network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ============================================================================
  # MongoDB - Base de Datos Principal
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: complexity-analyzer-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
      - MONGO_INITDB_DATABASE=complexity_analyzer
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - complexity-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # PostgreSQL - Alternativa de Base de Datos (Opcional)
  # ============================================================================
  # Descomentar si prefieres usar PostgreSQL
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: complexity-analyzer-postgres
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     - POSTGRES_USER=complexity_user
  #     - POSTGRES_PASSWORD=complexity_password
  #     - POSTGRES_DB=complexity_analyzer
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - complexity-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U complexity_user"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ============================================================================
  # Redis - Sistema de Caché
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: complexity-analyzer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - complexity-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Mongo Express - UI para MongoDB (Desarrollo)
  # ============================================================================
  mongo-express:
    image: mongo-express:1.0-alpine
    container_name: complexity-analyzer-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=admin123
      - ME_CONFIG_MONGODB_URL=mongodb://admin:admin123@mongodb:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      - mongodb
    networks:
      - complexity-network
    restart: unless-stopped
    profiles:
      - dev

  # ============================================================================
  # Redis Commander - UI para Redis (Desarrollo)
  # ============================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: complexity-analyzer-redis-commander
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - complexity-network
    restart: unless-stopped
    profiles:
      - dev

  # ============================================================================
  # Prometheus - Monitoreo (Opcional)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: complexity-analyzer-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - complexity-network
    restart: unless-stopped
    profiles:
      - monitoring

  # ============================================================================
  # Grafana - Visualización de Métricas (Opcional)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: complexity-analyzer-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - complexity-network
    restart: unless-stopped
    profiles:
      - monitoring

# ============================================================================
# Networks
# ============================================================================
networks:
  complexity-network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  # postgres_data:
  #   driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local