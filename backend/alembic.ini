# Alembic Configuration File
# ==========================
# Configuración de Alembic para migraciones de base de datos

[alembic]
# Ruta al directorio de scripts de migración
script_location = alembic

# Template para nuevas migraciones
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Prepend sys.path con el directorio raíz del proyecto
prepend_sys_path = .

# Timezone para timestamps en migraciones
# timezone =

# Truncar revisión para evitar nombres muy largos
# truncate_slug_length = 40

# Versiones offline
# version_path_separator = os
# version_locations = %(here)s/versions

# Output encoding
output_encoding = utf-8

# URL de la base de datos (se sobreescribe desde settings)
# sqlalchemy.url será configurado programáticamente desde run_migrations.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Hooks después de generar migración (formateo, etc.)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
